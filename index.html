<script>
(function(){
  "use strict";

  var TAGE = ["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"];
  var TAGE_KURZ = ["Mo","Di","Mi","Do","Fr","Sa","So"];
  var MONATE = ["Jänner","Februar","März","April","Mai","Juni",
                "Juli","August","September","Oktober","November","Dezember"];
  var ARTEN = ["Schule","Kindergarten","Musikschule","Nachhilfe","Sport","Arzt","Arbeit","Sonstiges"];
  var FARBEN = [
    {key:"pine",   name:"Grün"},
    {key:"stahl",  name:"Blau"},
    {key:"plum",   name:"Violett"},
    {key:"ocker",  name:"Ocker"},
    {key:"ziegel", name:"Rot"},
    {key:"schiefer",name:"Grau"}
  ];

  var db = null;
  var speicherBereit = false;
  var state = {
    tab: "heute",
    personen: [],
    wochenplan: [],
    termine: [],
    aufgaben: [],
    belohnungen: [],
    punkte: [],
    filter: null,      // Person-Id oder null
    wochenVersatz: 0,  // 0 = diese Woche
    vergangeneZeigen: false,
    punkteDatum: null  // wird beim Zeichnen auf heute gesetzt
  };

  // ---------- Hilfen ----------
  function el(id){ return document.getElementById(id); }
  function pad(n){ return (n<10?"0":"")+n; }
  function isoVon(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function heuteIso(){ return isoVon(new Date()); }
  function tagIndexHeute(){ return (new Date().getDay()+6)%7; } // 0 = Montag
  function datumLang(iso){
    var t = iso.split("-");
    var d = new Date(+t[0], +t[1]-1, +t[2]);
    return TAGE_KURZ[(d.getDay()+6)%7]+", "+(+t[2])+"."+(+t[1])+"."+t[0];
  }
  function sortZeit(a,b){
    var x=(a.von||"99:99"), y=(b.von||"99:99");
    return x<y?-1:x>y?1:0;
  }
  function escape(s){
    return String(s==null?"":s).replace(/[&<>"']/g,function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  var ERINNERUNGEN = [
    {min:0,   text:"keine Erinnerung"},
    {min:15,  text:"15 Minuten vorher"},
    {min:30,  text:"30 Minuten vorher"},
    {min:60,  text:"1 Stunde vorher"},
    {min:120, text:"2 Stunden vorher"},
    {min:1440,text:"am Vortag um diese Zeit"}
  ];
  function erinnerungText(min){
    for(var i=0;i<ERINNERUNGEN.length;i++) if(ERINNERUNGEN[i].min===min) return ERINNERUNGEN[i].text;
    return min+" Minuten vorher";
  }
  // ---------- Feiertage (Österreich) und schulfreie Tage in Salzburg ----------
  // Werden für jedes Jahr berechnet, damit nichts nachgepflegt werden muss.
  var feiertagsCache = {};

  function ostersonntag(jahr){
    var a = jahr % 19, b = Math.floor(jahr/100), c = jahr % 100;
    var d = Math.floor(b/4), e = b % 4;
    var f = Math.floor((b+8)/25), g = Math.floor((b-f+1)/3);
    var h = (19*a + b - d - g + 15) % 30;
    var i = Math.floor(c/4), k = c % 4;
    var l = (32 + 2*e + 2*i - h - k) % 7;
    var m = Math.floor((a + 11*h + 22*l) / 451);
    var monat = Math.floor((h + l - 7*m + 114) / 31);
    var tag = ((h + l - 7*m + 114) % 31) + 1;
    return new Date(jahr, monat-1, tag);
  }

  function feiertageFuer(jahr){
    if(feiertagsCache[jahr]) return feiertagsCache[jahr];
    var liste = {};
    function setz(datum, name, art){ liste[isoVon(datum)] = {name:name, art:art}; }
    function fest(monat, tag, name){ setz(new Date(jahr, monat-1, tag), name, "gesetzlich"); }

    fest(1, 1,  "Neujahr");
    fest(1, 6,  "Heilige Drei Könige");
    fest(5, 1,  "Staatsfeiertag");
    fest(8, 15, "Mariä Himmelfahrt");
    fest(10,26, "Nationalfeiertag");
    fest(11,1,  "Allerheiligen");
    fest(12,8,  "Mariä Empfängnis");
    fest(12,25, "Christtag");
    fest(12,26, "Stefanitag");

    var o = ostersonntag(jahr);
    function beweglich(tage, name){
      var d = new Date(o.getTime());
      d.setDate(d.getDate() + tage);
      setz(d, name, "gesetzlich");
    }
    beweglich(1,  "Ostermontag");
    beweglich(39, "Christi Himmelfahrt");
    beweglich(50, "Pfingstmontag");
    beweglich(60, "Fronleichnam");

    // Salzburger Besonderheit: kein Feiertag mehr, aber schulfrei
    var rupert = isoVon(new Date(jahr, 8, 24));
    if(!liste[rupert]) liste[rupert] = {name:"Rupertitag", art:"schulfrei"};

    feiertagsCache[jahr] = liste;
    return liste;
  }

  function feiertag(iso){
    if(!iso) return null;
    return feiertageFuer(+iso.slice(0,4))[iso] || null;
  }

  function person(id){
    for(var i=0;i<state.personen.length;i++) if(state.personen[i].id===id) return state.personen[i];
    return null;
  }
  function farbVar(p){ return "var(--p-"+((p&&p.farbe)||"schiefer")+")"; }
  function farbVarWeich(p){ return "var(--p-"+((p&&p.farbe)||"schiefer")+"-weich)"; }
  function neueId(){
    if(window.crypto && crypto.randomUUID) return crypto.randomUUID().replace(/-/g,"").slice(0,16);
    return "x"+Math.random().toString(36).slice(2,12)+Date.now().toString(36);
  }

  // ---------- Speicher (geteilt über alle Geräte) ----------
  function liste(name){ return state[name] || []; }
  function lokalSetzen(name, arr){ state[name] = arr; }

  function anlegen(name, daten){
    if(db){
      return db.collection(name).add(daten).catch(fehler);
    }
    var arr = liste(name).slice();
    daten = Object.assign({id:neueId()}, daten);
    arr.push(daten); lokalSetzen(name, arr); zeichne();
    return Promise.resolve();
  }
  function speichern(name, id, daten){
    if(db){
      return db.collection(name).doc(id).set(daten).catch(fehler);
    }
    var gefunden = false;
    var arr = liste(name).map(function(e){
      if(e.id===id){ gefunden = true; return Object.assign({id:id}, daten); }
      return e;
    });
    if(!gefunden) arr.push(Object.assign({id:id}, daten));
    lokalSetzen(name, arr); zeichne();
    return Promise.resolve();
  }
  function entfernen(name, id){
    if(db){
      return db.collection(name).doc(id).delete().catch(fehler);
    }
    lokalSetzen(name, liste(name).filter(function(e){ return e.id!==id; })); zeichne();
    return Promise.resolve();
  }
  var hinweisArt = null;
  function fehler(e){
    var code = e && e.code;
    if(code==="permission-denied"){
      meldung("Ändern ist mit diesem Familien-Code nicht erlaubt.", null, null, "fehler");
    } else {
      meldung("Speichern hat nicht geklappt. Bitte nochmal versuchen.", null, null, "fehler");
    }
  }
  function meldung(text, knopfText, aktion, art){
    hinweisArt = art || "fehler";
    el("hinweisText").textContent = text;
    var b = el("hinweisBtn");
    if(knopfText){ b.hidden=false; b.textContent=knopfText; b.onclick=aktion; }
    else { b.hidden=true; b.onclick=null; }
    el("hinweis").hidden = false;
  }

  function abonnieren(name){
    db.collection(name).onSnapshot(function(snap){
      var arr = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      lokalSetzen(name, arr);
      zeichne();
    }, function(e){
      if(e && e.code==="permission-denied"){
        codeLoeschen();
        torZeigen("Mit diesem Familien-Code geht es nicht auf. Bitte nochmal eingeben.");
        return;
      }
      meldung("Die Verbindung zum Plan ist abgerissen. Bitte die Seite neu laden.", null, null, "fehler");
    });
  }

  // ---------- Darstellung ----------
  function sichtbar(e){ return !state.filter || e.personId===state.filter || !e.personId; }

  function eintragHtml(e, opts){
    opts = opts || {};
    var p = person(e.personId);
    var farbe = farbVar(p);
    var zeit = e.von ? escape(e.von) : "—";
    var bis = e.bis ? '<span class="bis">'+escape(e.bis)+'</span>' : "";
    var meta = [];
    meta.push('<span class="wer'+(p?"":" fuer-alle")+'">'+escape(werName(e))+'</span>');
    if(e.art && e.art!=="Sonstiges") meta.push(escape(e.art));
    if(e.ort) meta.push(escape(e.ort));
    if(opts.datum && e.datum) meta.unshift(escape(datumLang(e.datum)));
    var daheim = e.daheim ? '<span class="daheim">daheim um <b>'+escape(e.daheim)+'</b></span>' : "";
    var notiz = e.notiz ? '<div class="meta">'+escape(e.notiz)+'</div>' : "";
    if(e.erinnerungMin > 0 && e.von){
      daheim += (daheim?" ":"")+'<span class="merker">Erinnerung '+erinnerungText(e.erinnerungMin)+'</span>';
    }
    return '<button class="eintrag" style="--pf:'+farbe+'" data-art="'+escape(e._quelle)+'" data-id="'+escape(e.id)+'">'
      + '<span class="streifen"></span>'
      + '<span class="zeit">'+zeit+bis+'</span>'
      + '<span class="text">'
        + '<span class="titel">'+escape(e.titel)+'</span>'
        + '<div class="meta">'+meta.join(" · ")+'</div>'
        + notiz + daheim
      + '</span></button>';
  }

  function eintraegeFuerTag(tagIndex, iso){
    var out = [];
    state.wochenplan.forEach(function(e){
      if(e.tag===tagIndex && sichtbar(e)) out.push(Object.assign({_quelle:"wochenplan"}, e));
    });
    if(iso){
      state.termine.forEach(function(e){
        if(e.datum===iso && sichtbar(e)) out.push(Object.assign({_quelle:"termine"}, e));
      });
    }
    return out.sort(sortZeit);
  }

  function zeichneHeute(){
    var heute = new Date();
    var morgen = new Date(heute.getTime()+86400000);
    var h = eintraegeFuerTag(tagIndexHeute(), isoVon(heute));
    var m = eintraegeFuerTag((tagIndexHeute()+1)%7, isoVon(morgen));

    function ftZeile(iso){
      var ft = feiertag(iso);
      if(!ft) return "";
      return '<span class="ft '+ft.art+'">'+escape(ft.name)
        + (ft.art==="schulfrei" ? " · schulfrei" : "") + '</span>';
    }

    var html = '<section class="abschnitt"><div class="abschnitt-kopf"><h2>Heute · '
      + TAGE[tagIndexHeute()] + '</h2>' + ftZeile(isoVon(heute))
      + '<span class="zaehler">'+h.length+'</span></div>'
      + '<div class="liste">'
      + (h.length ? h.map(function(e){return eintragHtml(e);}).join("")
                  : '<p class="leer">Heute steht nichts im Plan.</p>')
      + '</div></section>';

    html += '<section class="abschnitt"><div class="abschnitt-kopf"><h2>Morgen · '
      + TAGE[(tagIndexHeute()+1)%7] + '</h2>' + ftZeile(isoVon(morgen))
      + '<span class="zaehler">'+m.length+'</span></div>'
      + '<div class="liste">'
      + (m.length ? m.map(function(e){return eintragHtml(e);}).join("")
                  : '<p class="leer">Morgen steht nichts im Plan.</p>')
      + '</div></section>';

    var naechste = state.termine.filter(function(e){
      return sichtbar(e) && e.datum > isoVon(morgen);
    }).sort(function(a,b){ return a.datum<b.datum?-1:a.datum>b.datum?1:sortZeit(a,b); }).slice(0,4);

    if(naechste.length){
      html += '<section class="abschnitt"><div class="abschnitt-kopf"><h2>Als Nächstes</h2></div><div class="liste">'
        + naechste.map(function(e){ return eintragHtml(Object.assign({_quelle:"termine"},e), {datum:true}); }).join("")
        + '</div></section>';
    }
    return html;
  }

  function zeitZuMin(hhmm){
    if(!hhmm) return null;
    var t = hhmm.split(":");
    return (+t[0])*60 + (+t[1]);
  }
  function minZuZeit(m){ return pad(Math.floor(m/60))+":"+pad(m%60); }

  // Überlappende Einträge nebeneinander legen
  function spurenVerteilen(liste){
    liste.sort(function(a,b){ return (a.start-b.start) || (a.ende-b.ende); });
    var gruppe = [], gruppeEnde = -1;
    function abschliessen(g){
      var n = 0;
      g.forEach(function(x){ if(x.spur+1 > n) n = x.spur+1; });
      g.forEach(function(x){ x.spuren = n; });
    }
    liste.forEach(function(x){
      if(gruppe.length && x.start >= gruppeEnde){ abschliessen(gruppe); gruppe = []; gruppeEnde = -1; }
      var belegt = gruppe.filter(function(a){ return a.ende > x.start; }).map(function(a){ return a.spur; });
      x.spur = 0;
      while(belegt.indexOf(x.spur) >= 0) x.spur++;
      gruppe.push(x);
      if(x.ende > gruppeEnde) gruppeEnde = x.ende;
    });
    if(gruppe.length) abschliessen(gruppe);
    return liste;
  }

  function wochenBasis(){
    var d = new Date();
    d.setDate(d.getDate() - tagIndexHeute() + (state.wochenVersatz||0)*7);
    d.setHours(0,0,0,0);
    return d;
  }

  function zeichneWoche(){
    var basis = wochenBasis();
    var heuteIso_ = heuteIso();
    var tage = [];
    for(var i=0;i<7;i++){
      var d = new Date(basis.getTime()+i*86400000);
      var iso = isoVon(d);
      tage.push({ index:i, datum:d, iso:iso, istHeute:iso===heuteIso_, eintraege:eintraegeFuerTag(i, iso) });
    }

    var letzter = new Date(basis.getTime()+6*86400000);
    var kopf = '<div class="wochen-kopf">'
      + '<button class="icon-btn" id="wocheZurueck" aria-label="Woche zurück">‹</button>'
      + '<span class="wk-text ui">' + basis.getDate()+"."+(basis.getMonth()+1)+". – "
        + letzter.getDate()+"."+(letzter.getMonth()+1)+"."
        + (letzter.getFullYear()!==new Date().getFullYear() ? letzter.getFullYear() : "")
        + (state.wochenVersatz===0 ? '<span class="nur-gross"> · diese Woche</span>' : "") + '</span>'
      + '<button class="icon-btn" id="wocheVor" aria-label="Woche vor">›</button>'
      + (state.wochenVersatz!==0 ? '<button class="icon-btn" id="wocheHeute">Heute</button>' : "")
      + '</div>';

    return kopf
      + '<div class="nur-breit">' + wochenRasterHtml(tage) + '</div>'
      + '<div class="nur-schmal">' + wochenListeHtml(tage) + '</div>';
  }

  function wochenListeHtml(tage){
    var html = '<div class="wochenraster">';
    tage.forEach(function(t){
      var frei = !t.eintraege.length;
      var ft = feiertag(t.iso);
      html += '<div class="tag'+(t.istHeute?" ist-heute":"")+(frei?" frei-tag":"")+(ft?" ist-feiertag":"")+'">'
        + '<h3><span>'+TAGE[t.index]+(ft?' <span class="ft '+ft.art+'">'+escape(ft.name)+'</span>':"")+'</span>'
        + '<span>'+t.datum.getDate()+"."+(t.datum.getMonth()+1)+'.'
        + (frei ? ' <i>frei</i>' : "") + '</span></h3>'
        + (frei ? "" : t.eintraege.map(function(e){ return eintragHtml(e); }).join(""))
        + '</div>';
    });
    return html + '</div>';
  }

  function wochenRasterHtml(tage){
    var PX_PRO_MIN;
    var STANDARD_DAUER = 45;
    var LANG_AB = 170;   // ab dieser Dauer in Minuten nicht mehr ins Raster

    // Einträge aufteilen: lange Blöcke (Schule, Arbeit) nach oben, der Rest ins Raster
    tage.forEach(function(t){
      t.oben = [];
      t.raster = [];
      t.eintraege.forEach(function(e){
        var v = zeitZuMin(e.von);
        if(v === null){ t.oben.push({e:e}); return; }
        var bis = zeitZuMin(e.bis);
        var bEnde = (bis !== null && bis > v) ? bis : v + STANDARD_DAUER;
        if(bEnde - v >= LANG_AB) t.oben.push({e:e, start:v, ende:bEnde});
        else t.raster.push({e:e, start:v, ende:bEnde});
      });
    });

    // Zeitbereich nur aus den Rasterterminen
    var frueh = null, spaet = null;
    tage.forEach(function(t){
      t.raster.forEach(function(x){
        if(frueh === null || x.start < frueh) frueh = x.start;
        var e2 = x.ende;
        if(x.e.daheim){
          var dh = zeitZuMin(x.e.daheim);
          if(dh !== null && dh > e2) e2 = dh;
        }
        if(spaet === null || e2 > spaet) spaet = e2;
      });
    });
    if(frueh === null){ frueh = 8*60; spaet = 18*60; }
    var start = Math.floor((frueh-30)/60)*60;
    var ende = Math.ceil((spaet+30)/60)*60;
    if(start < 0) start = 0;
    if(ende - start < 180) ende = start + 180;      // mindestens 3 Stunden zeigen
    if(ende > 24*60) ende = 24*60;
    // Kleine Zeitfenster werden gedehnt, damit die Blöcke lesbar bleiben
    var fenster = ende - start;
    PX_PRO_MIN = fenster <= 300 ? 1.15 : (fenster <= 480 ? 0.9 : 0.75);
    var hoehe = Math.round(fenster*PX_PRO_MIN);

    // Kopfzeile
    var html = '<div class="raster">';
    html += '<div class="raster-kopf"><span class="rk-ecke"></span>';
    tage.forEach(function(t){
      var ft = feiertag(t.iso);
      html += '<span class="rk-tag'+(t.istHeute?" ist-heute":"")+(ft?" ist-feiertag":"")+'">'
        + '<b>'+TAGE_KURZ[t.index]+'</b> '+t.datum.getDate()+"."+(t.datum.getMonth()+1)+'.'
        + (ft ? '<span class="ft '+ft.art+'">'+escape(ft.name)+'</span>' : "")
        + '</span>';
    });
    html += '</div>';

    // Zeile für lange Einträge
    if(tage.some(function(t){ return t.oben.length; })){
      html += '<div class="raster-ganztags"><span class="rk-ecke">tagsüber</span>';
      tage.forEach(function(t){
        html += '<span class="gt-zelle'+(t.istHeute?" ist-heute":"")+'">'
          + t.oben.sort(function(a,b){ return (a.start||0)-(b.start||0); }).map(function(x){
              var e = x.e, p = person(e.personId);
              var spanne = e.von ? (e.von + (e.bis ? "–"+e.bis : "")) : "ganztags";
              var heim = e.daheim ? ' <i>&rarr; '+escape(e.daheim)+'</i>' : "";
              return '<button class="gt-block" style="--pf:'+farbVar(p)+';--pw:'+farbVarWeich(p)+'" '
                + 'data-art="'+escape(e._quelle)+'" data-id="'+escape(e.id)+'" '
                + 'title="'+escape(spanne+" "+e.titel+" ("+werName(e)+")"
                    +(e.daheim?" – daheim um "+e.daheim:""))+'">'
                + '<b>'+escape(e.titel)+' · '+escape(werName(e))+'</b>'
                + '<span>'+escape(spanne)+heim+'</span>'
                + '</button>';
            }).join("")
          + '</span>';
      });
      html += '</div>';
    }

    // Stundenachse + Spalten
    var stunden = "";
    for(var m=start; m<=ende; m+=60){
      stunden += '<span class="rs-stunde" style="top:'+Math.round((m-start)*PX_PRO_MIN)+'px">'
        + minZuZeit(m) + '</span>';
    }

    html += '<div class="raster-koerper" style="height:'+hoehe+'px;--stunde:'+(60*PX_PRO_MIN)+'px">'
      + '<div class="raster-stunden">'+stunden+'</div>';

    tage.forEach(function(t){
      var bloecke = spurenVerteilen(t.raster.slice());

      html += '<div class="raster-spalte'+(t.istHeute?" ist-heute":"")+'">';
      bloecke.forEach(function(x){
        var p = person(x.e.personId);
        var oben = Math.round((x.start-start)*PX_PRO_MIN);
        var h = Math.max(20, Math.round((x.ende-x.start)*PX_PRO_MIN) - 2);
        var spuren = x.spuren || 1;
        var schritt = 100 / spuren;
        // Bei mehreren gleichzeitigen Terminen dürfen sich die Blöcke leicht
        // überlappen – so bleibt für jeden Namen genug Breite.
        var links = x.spur * schritt;
        var breite = spuren > 1 ? Math.min(schritt*1.45, 100 - links) : schritt;
        var klasse = "";
        if(h < 40) klasse += " kurz";
        if(spuren > 2) klasse += " schmal";
        html += '<button class="block'+klasse+'" style="--pf:'+farbVar(p)+';--pw:'+farbVarWeich(p)+';'
          + 'top:'+oben+'px;height:'+h+'px;z-index:'+(x.spur+1)+';'
          + 'left:calc('+links+'% + 2px);width:calc('+breite+'% - 4px)" '
          + 'data-art="'+escape(x.e._quelle)+'" data-id="'+escape(x.e.id)+'" '
          + 'title="'+escape(x.e.von+(x.e.bis?"–"+x.e.bis:"")+" "+x.e.titel+" ("+werName(x.e)+")")+'">'
          + '<span class="bl-titel">'+escape(x.e.titel)+'</span>'
          + '<span class="bl-neben">'+escape(x.e.von)+' · '+escape(werName(x.e))+'</span>'
          + '</button>';
      });
      html += '</div>';
    });

    // Linie für "jetzt"
    if(state.wochenVersatz === 0){
      var jetzt = new Date();
      var jetztMin = jetzt.getHours()*60 + jetzt.getMinutes();
      if(jetztMin >= start && jetztMin <= ende){
        html += '<div class="jetzt-linie" style="top:'+Math.round((jetztMin-start)*PX_PRO_MIN)+'px"></div>';
      }
    }

    return html + '</div></div>';
  }

  // ---------- Kalender-Datei (.ics) für Handy-Kalender ----------
  var ICS_TAGE = ["MO","TU","WE","TH","FR","SA","SU"];

  function icsText(s){
    return String(s==null?"":s)
      .replace(/\\/g, "\\\\").replace(/;/g, "\\;")
      .replace(/,/g, "\\,").replace(/\r?\n/g, "\\n");
  }
  function icsStempel(){
    var d = new Date();
    function p(n){ return pad(n); }
    return d.getUTCFullYear()+p(d.getUTCMonth()+1)+p(d.getUTCDate())+"T"
         + p(d.getUTCHours())+p(d.getUTCMinutes())+p(d.getUTCSeconds())+"Z";
  }
  function icsZeitpunkt(datumIso, zeit){
    return datumIso.replace(/-/g,"") + "T" + (zeit||"09:00").replace(":","") + "00";
  }
  function zeitPlus(zeit, minuten){
    var m = zeitZuMin(zeit);
    if(m === null) return null;
    m = (m + minuten) % 1440;
    return minZuZeit(m);
  }
  function naechsterWochentag(tagIndex){
    var d = new Date();
    d.setHours(0,0,0,0);
    var heuteIdx = (d.getDay()+6)%7;
    var diff = (tagIndex - heuteIdx + 7) % 7;
    d.setDate(d.getDate() + diff);
    return d;
  }

  // Erzeugt den Inhalt einer Kalender-Datei für die übergebenen Einträge.
  function icsBauen(eintraege){
    var zeilen = [
      "BEGIN:VCALENDAR",
      "VERSION:2.0",
      "PRODID:-//Familienplaner//DE",
      "CALSCALE:GREGORIAN",
      "METHOD:PUBLISH"
    ];
    var stempel = icsStempel();

    eintraege.forEach(function(e){
      var p = person(e.personId);
      var titel = e.titel + " – " + werName(e);
      var von = e.von || "09:00";
      var bis = (e.bis && e.bis > von) ? e.bis : zeitPlus(von, 45);
      var start, wiederholung = null, uid;

      if(e._quelle === "wochenplan"){
        var d = naechsterWochentag(e.tag);
        start = isoVon(d);
        var ende = new Date(d.getTime());
        ende.setFullYear(ende.getFullYear()+1);
        wiederholung = "RRULE:FREQ=WEEKLY;BYDAY=" + ICS_TAGE[e.tag]
                     + ";UNTIL=" + isoVon(ende).replace(/-/g,"") + "T235959";
        uid = "w-" + e.id + "@familienplaner";
      } else {
        start = e.datum;
        uid = "t-" + e.id + "@familienplaner";
      }
      if(!start) return;

      zeilen.push("BEGIN:VEVENT");
      zeilen.push("UID:" + uid);
      zeilen.push("DTSTAMP:" + stempel);
      zeilen.push("DTSTART:" + icsZeitpunkt(start, von));
      zeilen.push("DTEND:" + icsZeitpunkt(start, bis));
      if(wiederholung) zeilen.push(wiederholung);
      zeilen.push("SUMMARY:" + icsText(titel));
      if(e.ort) zeilen.push("LOCATION:" + icsText(e.ort));
      var text = [];
      if(e.notiz) text.push(e.notiz);
      if(e.daheim) text.push("Zu Hause um " + e.daheim);
      if(text.length) zeilen.push("DESCRIPTION:" + icsText(text.join(" · ")));
      if(e.erinnerungMin > 0){
        zeilen.push("BEGIN:VALARM");
        zeilen.push("TRIGGER:-PT" + e.erinnerungMin + "M");
        zeilen.push("ACTION:DISPLAY");
        zeilen.push("DESCRIPTION:" + icsText(titel));
        zeilen.push("END:VALARM");
      }
      zeilen.push("END:VEVENT");
    });

    zeilen.push("END:VCALENDAR");
    return zeilen.join("\r\n");
  }

  function icsHerunterladen(eintraege, dateiname){
    if(!eintraege || !eintraege.length) return;
    var text = icsBauen(eintraege);
    try{
      var blob = new Blob([text], {type:"text/calendar;charset=utf-8"});
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = (dateiname || "termine").replace(/[^A-Za-z0-9_-]/g,"_") + ".ics";
      document.body.appendChild(a);
      a.click();
      setTimeout(function(){
        try{ document.body.removeChild(a); URL.revokeObjectURL(url); }catch(_){}
      }, 1500);
    }catch(_){
      meldung("Die Kalender-Datei konnte nicht erzeugt werden.", null, null, "fehler");
    }
  }

  function zeichneTermine(){
    var heute = heuteIso();
    var alle = state.termine.filter(sichtbar).sort(function(a,b){
      return a.datum<b.datum?-1:a.datum>b.datum?1:sortZeit(a,b);
    });
    var kommend = alle.filter(function(e){ return e.datum>=heute; });
    var vergangen = alle.filter(function(e){ return e.datum<heute; }).reverse();

    var gruppen = {}, reihenfolge = [];
    kommend.forEach(function(e){
      if(!gruppen[e.datum]){ gruppen[e.datum]=[]; reihenfolge.push(e.datum); }
      gruppen[e.datum].push(e);
    });

    var html = "";
    if(kommend.length){
      var wer = state.filter && person(state.filter) ? person(state.filter).name : null;
      html += '<div class="wochen-kopf"><button class="icon-btn" id="btnIcsAlle">'
        + (wer ? 'Termine von '+escape(wer)+' in den Kalender' : 'Alle Termine in den Kalender')
        + '</button></div>';
    }
    html += '<section class="abschnitt"><div class="abschnitt-kopf"><h2>Kommende Termine</h2>'
      + '<span class="zaehler">'+kommend.length+'</span></div>';
    if(!kommend.length){
      html += '<p class="leer">Keine Termine eingetragen.</p>';
    }
    reihenfolge.forEach(function(iso){
      html += '<div class="abschnitt-kopf" style="margin-top:14px"><h2>'+escape(datumLang(iso))+'</h2></div>'
        + '<div class="liste">'
        + gruppen[iso].map(function(e){ return eintragHtml(Object.assign({_quelle:"termine"},e)); }).join("")
        + '</div>';
    });
    html += '</section>';

    if(vergangen.length){
      html += '<section class="abschnitt"><div class="abschnitt-kopf">'
        + '<h2>Vergangene Termine</h2><span class="zaehler">'+vergangen.length+'</span></div>';
      if(state.vergangeneZeigen){
        html += '<div class="liste">'
          + vergangen.map(function(e){
              var k = eintragHtml(Object.assign({_quelle:"termine"},e), {datum:true});
              return k.replace('class="eintrag"','class="eintrag erledigt"');
            }).join("")
          + '</div>';
      }
      html += '<button class="knopf" id="btnVergangene" style="margin-top:8px">'
        + (state.vergangeneZeigen?"Vergangene ausblenden":"Vergangene anzeigen")+'</button></section>';
    }
    return html;
  }

  // ---------- Belohnungspunkte ----------
  function punkteDokId(pid, datum){ return pid+"_"+datum.slice(0,7); }
  function punkteDok(pid, datum){
    var id = punkteDokId(pid, datum);
    for(var i=0;i<state.punkte.length;i++) if(state.punkte[i].id===id) return state.punkte[i];
    return null;
  }
  function punkteKinder(){
    return state.personen.filter(function(p){ return p.sammelt; });
  }
  function aufgabenFuer(pid){
    return state.aufgaben.filter(function(a){ return !a.personId || a.personId===pid; });
  }
  function erledigtAm(pid, datum){
    var d = punkteDok(pid, datum);
    return (d && d.tage && d.tage[datum]) ? d.tage[datum] : {};
  }
  function standVon(pid){
    var summe = 0;
    state.punkte.forEach(function(d){
      if(d.personId!==pid) return;
      Object.keys(d.tage||{}).forEach(function(tag){
        var e = d.tage[tag] || {};
        Object.keys(e).forEach(function(k){ summe += (+e[k] || 0); });
      });
      (d.buchungen||[]).forEach(function(b){ summe += (+b.punkte || 0); });
    });
    return summe;
  }
  function standSeit(pid, abIso){
    var summe = 0;
    state.punkte.forEach(function(d){
      if(d.personId!==pid) return;
      Object.keys(d.tage||{}).forEach(function(tag){
        if(tag < abIso) return;
        var e = d.tage[tag] || {};
        Object.keys(e).forEach(function(k){ summe += (+e[k] || 0); });
      });
      (d.buchungen||[]).forEach(function(b){ if(b.datum >= abIso) summe += (+b.punkte || 0); });
    });
    return summe;
  }
  function punkteSchreiben(pid, datum, aendern){
    var id = punkteDokId(pid, datum);
    var vorhanden = punkteDok(pid, datum);
    var dok = vorhanden
      ? JSON.parse(JSON.stringify(vorhanden))
      : {personId:pid, monat:datum.slice(0,7), tage:{}, buchungen:[]};
    delete dok.id;
    dok.tage = dok.tage || {};
    dok.buchungen = dok.buchungen || [];
    aendern(dok);
    return speichern("punkte", id, dok);
  }
  function aufgabeUmschalten(pid, datum, aufgabe){
    punkteSchreiben(pid, datum, function(dok){
      var tag = Object.assign({}, dok.tage[datum]);
      if(tag[aufgabe.id] !== undefined) delete tag[aufgabe.id];
      else tag[aufgabe.id] = +aufgabe.punkte || 0;
      dok.tage[datum] = tag;
    });
  }
  function buchen(pid, datum, titel, punkte, art){
    punkteSchreiben(pid, datum, function(dok){
      dok.buchungen = dok.buchungen.concat([{
        id: neueId(), datum: datum, titel: titel, punkte: punkte, art: art
      }]);
    });
  }
  function buchungLoeschen(pid, datum, buchungId){
    punkteSchreiben(pid, datum, function(dok){
      dok.buchungen = dok.buchungen.filter(function(b){ return b.id!==buchungId; });
    });
  }
  function letzteBuchungen(pid, anzahl){
    var alle = [];
    state.punkte.forEach(function(d){
      if(d.personId!==pid) return;
      (d.buchungen||[]).forEach(function(b){ alle.push(b); });
    });
    alle.sort(function(a,b){ return a.datum<b.datum?1:a.datum>b.datum?-1:0; });
    return alle.slice(0, anzahl);
  }
  function wochenStartIso(){
    var d = new Date();
    d.setDate(d.getDate() - ((d.getDay()+6)%7));
    return isoVon(d);
  }

  function zeichnePunkte(){
    var datum = state.punkteDatum || heuteIso();
    var kinder = punkteKinder();
    var kopf = '<section class="abschnitt"><div class="punkte-kopf">'
      + '<button class="icon-btn" id="pkTagZurueck" aria-label="Tag zurück">‹</button>'
      + '<span class="pk-datum ui">'+escape(datumLang(datum))+(datum===heuteIso()?" · heute":"")+'</span>'
      + '<button class="icon-btn" id="pkTagVor" aria-label="Tag vor">›</button>'
      + '<button class="icon-btn" id="pkEinstellungen" style="margin-left:auto">Aufgaben &amp; Belohnungen</button>'
      + '</div></section>';

    if(!kinder.length){
      return kopf + '<p class="leer">Noch sammelt niemand Punkte. Unter <b>Personen</b> bei einem Kind '
        + '„sammelt Belohnungspunkte" anhaken.</p>';
    }

    var karten = kinder.map(function(p){
      var stand = standVon(p.id);
      var woche = standSeit(p.id, wochenStartIso());
      var erledigt = erledigtAm(p.id, datum);
      var aufgaben = aufgabenFuer(p.id);
      var heuteSumme = 0;
      Object.keys(erledigt).forEach(function(k){ heuteSumme += (+erledigt[k]||0); });

      var aufgabenHtml = aufgaben.length
        ? aufgaben.map(function(a){
            var an = erledigt[a.id] !== undefined;
            return '<button class="aufgabe" data-pid="'+escape(p.id)+'" data-aid="'+escape(a.id)+'" aria-pressed="'+an+'">'
              + '<span class="haken" aria-hidden="true">'+(an?"✓":"")+'</span>'
              + '<span class="a-name">'+escape(a.titel)+'</span>'
              + '<span class="a-punkte">'+(a.punkte>=0?"+":"")+escape(a.punkte)+'</span>'
              + '</button>';
          }).join("")
        : '<p class="leer">Noch keine Aufgaben angelegt.</p>';

      var buchungen = letzteBuchungen(p.id, 3).map(function(b){
        return '<div class="buchung"><span>'+escape(b.titel)+'</span>'
          + '<span class="b-punkte">'+(b.punkte>0?"+":"")+escape(b.punkte)+'</span>'
          + '<button class="b-weg" data-pid="'+escape(p.id)+'" data-bdatum="'+escape(b.datum)+'" '
          + 'data-bid="'+escape(b.id)+'" aria-label="Buchung zurücknehmen">×</button></div>';
      }).join("");

      return '<div class="punktekarte" style="--pf:'+farbVar(p)+'">'
        + '<div class="pk-oben">'
          + '<div><div class="pk-name">'+escape(p.name)+'</div>'
          + '<div class="pk-neben">diese Woche '+(woche>=0?"+":"")+woche+' · heute '+(heuteSumme>=0?"+":"")+heuteSumme+'</div></div>'
          + '<div class="pk-stand"><span>'+stand+'</span><small>Punkte</small></div>'
        + '</div>'
        + '<div class="aufgabenliste">'+aufgabenHtml+'</div>'
        + (buchungen ? '<div class="buchungen">'+buchungen+'</div>' : "")
        + '<div class="pk-fuss">'
          + '<button class="knopf" data-einloesen="'+escape(p.id)+'">Belohnung einlösen</button>'
          + '<button class="knopf" data-bonus="'+escape(p.id)+'">Extra-Punkte</button>'
        + '</div>'
        + '</div>';
    }).join("");

    return kopf + '<div class="punkteraster">'+karten+'</div>';
  }

  function zeichnePersonenLeiste(){
    var box = el("personenLeiste");
    if(!state.personen.length){ box.innerHTML=""; return; }
    box.innerHTML = state.personen.map(function(p){
      var an = !state.filter || state.filter===p.id;
      return '<button class="pchip" style="--pf:'+farbVar(p)+'" data-pid="'+escape(p.id)+'" aria-pressed="'+an+'">'
        + '<span class="punkt"></span>'+escape(p.name)+'</button>';
    }).join("");
  }

  function zeichne(){
    var heute = new Date();
    el("heuteDatum").textContent = TAGE[tagIndexHeute()]+", "+heute.getDate()+"."+(heute.getMonth()+1)+"."+heute.getFullYear();
    el("druckTitel").textContent = "Familienplaner – Woche ab "+datumLang(isoVon(new Date(heute.getTime()-tagIndexHeute()*86400000)));

    ["heute","woche","termine","punkte"].forEach(function(t){
      el("tab"+t.charAt(0).toUpperCase()+t.slice(1)).setAttribute("aria-selected", String(state.tab===t));
    });
    zeichnePersonenLeiste();
    el("personenLeiste").hidden = (state.tab==="punkte");
    el("btnNeu").hidden = (state.tab==="punkte");
    el("inhalt").innerHTML =
      state.tab==="heute" ? zeichneHeute() :
      state.tab==="woche" ? zeichneWoche() :
      state.tab==="punkte" ? zeichnePunkte() : zeichneTermine();

    var bv = el("btnVergangene");
    if(bv) bv.onclick = function(){ state.vergangeneZeigen = !state.vergangeneZeigen; zeichne(); };

    var bi = el("btnIcsAlle");
    if(bi) bi.onclick = function(){
      var h = heuteIso();
      var liste = state.termine.filter(function(x){ return sichtbar(x) && x.datum >= h; })
        .sort(function(a,b){ return a.datum<b.datum?-1:a.datum>b.datum?1:0; })
        .map(function(x){ return Object.assign({_quelle:"termine"}, x); });
      var p = state.filter ? person(state.filter) : null;
      icsHerunterladen(liste, p ? "termine-"+p.name : "familientermine");
    };

    if(state.tab==="woche"){
      var wz = el("wocheZurueck"), wv = el("wocheVor"), wh = el("wocheHeute");
      if(wz) wz.onclick = function(){ state.wochenVersatz--; zeichne(); };
      if(wv) wv.onclick = function(){ state.wochenVersatz++; zeichne(); };
      if(wh) wh.onclick = function(){ state.wochenVersatz = 0; zeichne(); };
    }

    if(verbunden && !state.personen.length && hinweisArt!=="fehler"){
      meldung("Zuerst eintragen, wer zur Familie gehört.", "Personen anlegen", personenFormular, "start");
    } else if(hinweisArt==="start" && state.personen.length){
      el("hinweis").hidden = true; hinweisArt = null;
    }

    if(state.tab==="punkte"){
      var tagVerschieben = function(richtung){
        var t = (state.punkteDatum || heuteIso()).split("-");
        var d = new Date(+t[0], +t[1]-1, +t[2]);
        d.setDate(d.getDate()+richtung);
        state.punkteDatum = isoVon(d);
        zeichne();
      };
      var bz = el("pkTagZurueck"), bvor = el("pkTagVor"), be = el("pkEinstellungen");
      if(bz) bz.onclick = function(){ tagVerschieben(-1); };
      if(bvor) bvor.onclick = function(){ tagVerschieben(1); };
      if(be) be.onclick = aufgabenFormular;
    }
  }

  // ---------- Formular ----------
  var offenesBlatt = null;
  function blattSchliessen(){
    if(offenesBlatt){ offenesBlatt.remove(); offenesBlatt=null; }
  }
  function blattOeffnen(html){
    blattSchliessen();
    var s = document.createElement("div");
    s.className = "schleier";
    s.innerHTML = '<div class="blatt" role="dialog" aria-modal="true">'+html+'</div>';
    s.addEventListener("click", function(ev){ if(ev.target===s) blattSchliessen(); });
    document.body.appendChild(s);
    offenesBlatt = s;
    return s.querySelector(".blatt");
  }
  document.addEventListener("keydown", function(e){ if(e.key==="Escape") blattSchliessen(); });

  function personOptionen(gewaehlt){
    // "Alle" für Sachen, die die ganze Familie betreffen (Urlaub, Ausflug, Geburtstag)
    var html = '<option value=""'+(gewaehlt===""?" selected":"")+'>Alle</option>';
    return html + state.personen.map(function(p, i){
      var an = (gewaehlt === undefined) ? (i===0) : (p.id === gewaehlt);
      return '<option value="'+escape(p.id)+'"'+(an?" selected":"")+'>'+escape(p.name)+'</option>';
    }).join("");
  }
  function werName(e){
    var p = person(e.personId);
    return p ? p.name : "Alle";
  }

  function eintragFormular(quelle, id){
    if(!state.personen.length){ personenFormular(); return; }
    var vorhanden = null;
    if(id){
      var arr = quelle==="wochenplan" ? state.wochenplan : state.termine;
      for(var i=0;i<arr.length;i++) if(arr[i].id===id) vorhanden = arr[i];
    }
    var e = vorhanden || {};
    var istWoche = vorhanden ? quelle==="wochenplan" : true;

    // Gehört der Eintrag zu einer Reihe gleicher Termine? Dann alle zusammen anbieten.
    var serie = [];
    if(vorhanden && quelle==="termine"){
      var abIso = heuteIso();
      serie = state.termine.filter(function(x){
        return x.titel===e.titel && x.personId===e.personId && x.von===e.von && x.datum >= abIso;
      }).sort(function(a,b){ return a.datum<b.datum?-1:a.datum>b.datum?1:0; });
    }
    var gewaehlteTage = vorhanden && quelle==="wochenplan" ? [e.tag] : [tagIndexHeute()];

    var b = blattOeffnen(
      '<h2>'+(vorhanden?"Eintrag ändern":"Neuer Eintrag")+'</h2>'
      + '<div class="feld"><label for="fTyp">Was für ein Eintrag</label>'
        + '<select id="fTyp"'+(vorhanden?" disabled":"")+'>'
          + '<option value="wochenplan"'+(istWoche?" selected":"")+'>Jede Woche gleich (z. B. Schule, Musikstunde)</option>'
          + '<option value="termine"'+(!istWoche?" selected":"")+'>Einzelner Termin (z. B. Arzt)</option>'
        + '</select></div>'
      + '<div class="feld"><label for="fPerson">Wer</label><select id="fPerson">'+personOptionen(e.personId)+'</select></div>'
      + '<div class="feld"><label for="fTitel">Was</label>'
        + '<input type="text" id="fTitel" value="'+escape(e.titel||"")+'" placeholder="z. B. Schule, Gitarre, Dr. Berger"></div>'
      + '<div class="feld"><label for="fArt">Kategorie</label><select id="fArt">'
        + ARTEN.map(function(a){ return '<option'+(a===(e.art||"Sonstiges")?" selected":"")+'>'+a+'</option>'; }).join("")
        + '</select></div>'
      + '<div class="feld" id="feldTage"><label>An welchen Tagen</label><div class="chips" id="fTage">'
        + TAGE_KURZ.map(function(t,i){
            return '<button type="button" class="chip" data-tag="'+i+'" aria-pressed="'
              + (gewaehlteTage.indexOf(i)>=0) + '">'+t+'</button>';
          }).join("")
        + '</div></div>'
      + '<div class="feld" id="feldDatum" hidden><label>An welchen Tagen</label>'
        + '<div class="kal">'
          + '<div class="kal-kopf">'
            + '<button type="button" class="kal-pfeil" id="kalZurueck" aria-label="Monat zurück">‹</button>'
            + '<span class="kal-monat ui" id="kalMonat"></span>'
            + '<button type="button" class="kal-pfeil" id="kalVor" aria-label="Monat vor">›</button>'
          + '</div>'
          + '<div class="kal-wochentage">'+TAGE_KURZ.map(function(t){return '<span>'+t+'</span>';}).join("")+'</div>'
          + '<div class="kal-gitter" id="kalGitter"></div>'
          + '<div class="kal-liste" id="kalListe"></div>'
          + '<div class="kal-fuss">'
            + '<span class="kal-anzahl ui" id="kalAnzahl"></span>'
            + '<span class="kal-reihe" id="kalReihe">'
              + '<select id="kalTakt" aria-label="Abstand"><option value="1">jede Woche</option>'
              + '<option value="2" selected>alle 2 Wochen</option><option value="3">alle 3 Wochen</option>'
              + '<option value="4">alle 4 Wochen</option></select>'
              + '<input type="text" id="kalMal" inputmode="numeric" value="8" aria-label="Anzahl Termine">'
              + '<button type="button" class="kal-knopf" id="kalFuellen">Reihe</button>'
            + '</span>'
          + '</div>'
        + '</div></div>'
      + '<div class="feld"><label>Uhrzeit</label><div class="zeile">'
        + '<input type="time" id="fVon" value="'+escape(e.von||"")+'" aria-label="von">'
        + '<input type="time" id="fBis" value="'+escape(e.bis||"")+'" aria-label="bis">'
        + '</div></div>'
      + '<div class="feld"><label for="fErinnerung">Erinnerung</label><select id="fErinnerung">'
        + ERINNERUNGEN.map(function(r){
            return '<option value="'+r.min+'"'+(r.min===(e.erinnerungMin||0)?" selected":"")+'>'+r.text+'</option>';
          }).join("")
        + '</select></div>'
      + '<div class="feld"><label for="fDaheim">Zu Hause um (wenn wichtig)</label>'
        + '<input type="time" id="fDaheim" value="'+escape(e.daheim||"")+'"></div>'
      + '<div class="feld"><label for="fOrt">Wo</label>'
        + '<input type="text" id="fOrt" value="'+escape(e.ort||"")+'" placeholder="z. B. Musikschule Mittersill"></div>'
      + '<div class="feld"><label for="fNotiz">Notiz</label>'
        + '<textarea id="fNotiz" placeholder="z. B. Bus 9:20, E-Card mitnehmen">'+escape(e.notiz||"")+'</textarea></div>'
      + (vorhanden ? '<div class="blatt-fuss"><button class="knopf breit" id="fKalender">'
            + (serie.length > 1 ? 'Alle '+serie.length+' in den Handy-Kalender' : 'In den Handy-Kalender')
            + '</button></div>' : "")
      + '<div class="blatt-fuss">'
        + '<button class="knopf haupt" id="fSpeichern">Speichern</button>'
        + '<button class="knopf" id="fAbbrechen">Abbrechen</button>'
        + (vorhanden?'<button class="knopf loeschen" id="fLoeschen">Löschen</button>':"")
      + '</div>'
    );

    // --- Monatskalender mit Mehrfachauswahl ---
    // Bei einem neuen Termin ist absichtlich kein Tag vorgewählt – sonst legt
    // man versehentlich einen zusätzlichen Termin für heute an.
    var gewaehlteDaten = (vorhanden && quelle==="termine" && e.datum) ? [e.datum] : [];
    var kalMonat;
    (function(){
      var t = (gewaehlteDaten[0] || heuteIso()).split("-");
      kalMonat = new Date(+t[0], +t[1]-1, 1);
    })();

    function kalZeichnen(){
      var g = b.querySelector("#kalGitter");
      if(!g) return;
      b.querySelector("#kalMonat").textContent = MONATE[kalMonat.getMonth()]+" "+kalMonat.getFullYear();
      var jahr = kalMonat.getFullYear(), monat = kalMonat.getMonth();
      var versatz = (new Date(jahr, monat, 1).getDay()+6)%7;
      var anzahlTage = new Date(jahr, monat+1, 0).getDate();
      var html = "";
      for(var i=0;i<versatz;i++) html += '<span class="kal-leer"></span>';
      for(var d=1; d<=anzahlTage; d++){
        var iso = jahr+"-"+pad(monat+1)+"-"+pad(d);
        var an = gewaehlteDaten.indexOf(iso) >= 0;
        var ft = feiertag(iso);
        html += '<button type="button" class="kal-tag'+(an?" an":"")+(iso===heuteIso()?" ist-heute":"")
          + (ft?" ist-feiertag "+ft.art:"")+'" data-iso="'+iso+'" aria-pressed="'+an+'"'
          + (ft?' title="'+escape(ft.name)+'"':"")+'>'+d+'</button>';
      }
      g.innerHTML = html;
      var n = gewaehlteDaten.length;
      var za = b.querySelector("#kalAnzahl");
      za.textContent = n===0 ? "Tag antippen" : (n===1 ? "1 Termin" : n+" Termine");
      if(n) za.classList.remove("fehlt");
      b.querySelector("#kalReihe").hidden = !!vorhanden;

      var lst = b.querySelector("#kalListe");
      if(n > 1){
        lst.hidden = false;
        lst.innerHTML = gewaehlteDaten.slice().sort().map(function(iso){
          var t = iso.split("-");
          return '<button type="button" class="kal-marke" data-iso="'+iso+'" '
            + 'title="Diesen Tag wieder entfernen">'+(+t[2])+"."+(+t[1])+". ×</button>";
        }).join("");
      } else {
        lst.hidden = true; lst.innerHTML = "";
      }
    }

    b.querySelector("#kalGitter").addEventListener("click", function(ev){
      var t = ev.target.closest(".kal-tag"); if(!t) return;
      var iso = t.dataset.iso, i = gewaehlteDaten.indexOf(iso);
      if(vorhanden){ gewaehlteDaten = [iso]; }
      else if(i >= 0){ gewaehlteDaten.splice(i,1); }
      else { gewaehlteDaten.push(iso); }
      kalZeichnen();
    });
    b.querySelector("#kalListe").addEventListener("click", function(ev){
      var m = ev.target.closest(".kal-marke"); if(!m) return;
      var i = gewaehlteDaten.indexOf(m.dataset.iso);
      if(i >= 0) gewaehlteDaten.splice(i,1);
      kalZeichnen();
    });
    b.querySelector("#kalZurueck").addEventListener("click", function(){
      kalMonat = new Date(kalMonat.getFullYear(), kalMonat.getMonth()-1, 1); kalZeichnen();
    });
    b.querySelector("#kalVor").addEventListener("click", function(){
      kalMonat = new Date(kalMonat.getFullYear(), kalMonat.getMonth()+1, 1); kalZeichnen();
    });
    b.querySelector("#kalFuellen").addEventListener("click", function(){
      if(!gewaehlteDaten.length) return;
      var takt = parseInt(b.querySelector("#kalTakt").value, 10) || 1;
      var mal = parseInt(b.querySelector("#kalMal").value, 10) || 2;
      if(mal < 2) mal = 2; if(mal > 40) mal = 40;
      var sortiert = gewaehlteDaten.slice().sort();
      var s = sortiert[sortiert.length-1].split("-");
      var d = new Date(+s[0], +s[1]-1, +s[2]);
      for(var k=1; k<mal; k++){
        d.setDate(d.getDate() + takt*7);
        var iso = isoVon(d);
        if(gewaehlteDaten.indexOf(iso) < 0) gewaehlteDaten.push(iso);
      }
      kalZeichnen();
    });

    function typUmschalten(){
      var woche = b.querySelector("#fTyp").value==="wochenplan";
      b.querySelector("#feldTage").hidden = !woche;
      b.querySelector("#feldDatum").hidden = woche;
      if(!woche) kalZeichnen();
    }
    b.querySelector("#fTyp").addEventListener("change", typUmschalten);
    typUmschalten();

    b.querySelector("#fTage").addEventListener("click", function(ev){
      var c = ev.target.closest(".chip"); if(!c) return;
      if(vorhanden){
        Array.prototype.forEach.call(b.querySelectorAll("#fTage .chip"), function(x){
          x.setAttribute("aria-pressed","false");
        });
        c.setAttribute("aria-pressed","true");
      } else {
        c.setAttribute("aria-pressed", c.getAttribute("aria-pressed")==="true" ? "false":"true");
      }
    });

    b.querySelector("#fAbbrechen").addEventListener("click", blattSchliessen);
    if(vorhanden){
      b.querySelector("#fKalender").addEventListener("click", function(){
        var liste = (serie.length > 1 ? serie : [e]).map(function(x){
          return Object.assign({_quelle:quelle}, x);
        });
        icsHerunterladen(liste, e.titel || "termin");
      });
    }
    if(vorhanden){
      b.querySelector("#fLoeschen").addEventListener("click", function(){
        entfernen(quelle, id); blattSchliessen();
      });
    }

    b.querySelector("#fSpeichern").addEventListener("click", function(){
      var typ = b.querySelector("#fTyp").value;
      var titel = b.querySelector("#fTitel").value.trim();
      if(!titel){ b.querySelector("#fTitel").focus(); return; }
      var daten = {
        personId: b.querySelector("#fPerson").value,
        titel: titel,
        art: b.querySelector("#fArt").value,
        von: b.querySelector("#fVon").value,
        bis: b.querySelector("#fBis").value,
        daheim: b.querySelector("#fDaheim").value,
        erinnerungMin: +b.querySelector("#fErinnerung").value || 0,
        ort: b.querySelector("#fOrt").value.trim(),
        notiz: b.querySelector("#fNotiz").value.trim()
      };
      if(typ==="wochenplan"){
        var tage = Array.prototype.filter.call(b.querySelectorAll("#fTage .chip"), function(c){
          return c.getAttribute("aria-pressed")==="true";
        }).map(function(c){ return +c.dataset.tag; });
        if(!tage.length){ return; }
        if(vorhanden){ speichern("wochenplan", id, Object.assign({tag:tage[0]}, daten)); }
        else { tage.forEach(function(t){ anlegen("wochenplan", Object.assign({tag:t}, daten)); }); }
      } else {
        var tage = gewaehlteDaten.slice().sort();
        if(!tage.length){
          var za2 = b.querySelector("#kalAnzahl");
          za2.classList.add("fehlt");
          za2.textContent = "Bitte einen Tag antippen";
          try{ b.querySelector(".kal").scrollIntoView({block:"center", behavior:"smooth"}); }catch(_){}
          return;
        }
        if(vorhanden){
          speichern("termine", id, Object.assign({datum:tage[0]}, daten));
        } else {
          tage.forEach(function(t){ anlegen("termine", Object.assign({datum:t}, daten)); });
        }
      }
      blattSchliessen();
    });
  }

  function personenFormular(){
    var b = blattOeffnen(
      '<h2>Wer gehört zur Familie</h2>'
      + '<div class="personen-tabelle" id="pTabelle"></div>'
      + '<button class="knopf" id="pNeu">+ Person hinzufügen</button>'
      + '<div class="blatt-fuss"><button class="knopf haupt" id="pFertig">Fertig</button></div>'
    );
    var entwurf = state.personen.map(function(p){
      return {id:p.id, name:p.name, farbe:p.farbe, sammelt:!!p.sammelt};
    });
    if(!entwurf.length) entwurf.push({id:null, name:"", farbe:"pine", sammelt:false});

    function zeichnePersonen(){
      b.querySelector("#pTabelle").innerHTML = entwurf.map(function(p,i){
        return '<div class="preihe" style="--pf:'+farbVar(p)+'">'
          + '<input type="text" value="'+escape(p.name)+'" data-i="'+i+'" data-feld="name" placeholder="Name" aria-label="Name">'
          + '<select data-i="'+i+'" data-feld="farbe" aria-label="Farbe">'
            + FARBEN.map(function(f){
                return '<option value="'+f.key+'"'+(f.key===p.farbe?" selected":"")+'>'+f.name+'</option>';
              }).join("")
          + '</select>'
          + '<button class="weg" data-weg="'+i+'" aria-label="Person entfernen">×</button>'
          + '<label class="kasten"><input type="checkbox" data-i="'+i+'" data-feld="sammelt"'
          + (p.sammelt?" checked":"")+'> sammelt Belohnungspunkte</label>'
          + '</div>';
      }).join("");
    }
    zeichnePersonen();

    b.querySelector("#pTabelle").addEventListener("input", function(ev){
      var t = ev.target; if(t.dataset.i===undefined) return;
      entwurf[+t.dataset.i][t.dataset.feld] = (t.type==="checkbox") ? t.checked : t.value;
    });
    b.querySelector("#pTabelle").addEventListener("change", function(ev){
      var t = ev.target;
      if(t.dataset.feld==="farbe"){ entwurf[+t.dataset.i].farbe = t.value; zeichnePersonen(); }
    });
    b.querySelector("#pTabelle").addEventListener("click", function(ev){
      var w = ev.target.closest("[data-weg]"); if(!w) return;
      entwurf.splice(+w.dataset.weg,1); zeichnePersonen();
    });
    b.querySelector("#pNeu").addEventListener("click", function(){
      entwurf.push({id:null, name:"", farbe:FARBEN[entwurf.length % FARBEN.length].key});
      zeichnePersonen();
    });

    b.querySelector("#pFertig").addEventListener("click", function(){
      var behalten = {};
      var bisher = state.personen.slice();
      entwurf.forEach(function(p){
        var name = (p.name||"").trim();
        if(!name) return;
        var daten = {name:name, farbe:p.farbe, sammelt:!!p.sammelt};
        if(p.id){ behalten[p.id]=true; speichern("personen", p.id, daten); }
        else { anlegen("personen", daten); }
      });
      bisher.forEach(function(p){
        if(!behalten[p.id]) entfernen("personen", p.id);
      });
      blattSchliessen();
    });
  }

  function einloesenFormular(pid, datum){
    var p = person(pid);
    var stand = standVon(pid);
    var passend = state.belohnungen.filter(function(b){ return !b.personId || b.personId===pid; });
    var b = blattOeffnen(
      '<h2>Belohnung für '+escape(p?p.name:"")+'</h2>'
      + '<p class="pk-neben" style="margin:-6px 0 14px">Aktueller Stand: <b>'+stand+' Punkte</b></p>'
      + (passend.length
          ? '<div class="personen-tabelle">'
            + passend.map(function(x){
                var reicht = stand >= (+x.kosten||0);
                return '<button class="knopf belohnung" data-bid="'+escape(x.id)+'"'+(reicht?"":" disabled")+'>'
                  + '<span>'+escape(x.titel)+'</span><span class="b-kosten">'+escape(x.kosten)+' Punkte</span></button>';
              }).join("")
            + '</div>'
          : '<p class="leer">Noch keine Belohnungen angelegt – unter „Aufgaben &amp; Belohnungen".</p>')
      + '<div class="blatt-fuss"><button class="knopf haupt" id="bAbbrechen">Schließen</button></div>'
    );
    b.querySelector("#bAbbrechen").addEventListener("click", blattSchliessen);
    b.addEventListener("click", function(ev){
      var k = ev.target.closest(".belohnung"); if(!k || k.disabled) return;
      var gewaehlt = null;
      state.belohnungen.forEach(function(x){ if(x.id===k.dataset.bid) gewaehlt = x; });
      if(!gewaehlt) return;
      buchen(pid, datum, "Eingelöst: "+gewaehlt.titel, -(+gewaehlt.kosten||0), "einloesen");
      blattSchliessen();
    });
  }

  function bonusFormular(pid, datum){
    var p = person(pid);
    var b = blattOeffnen(
      '<h2>Extra-Punkte für '+escape(p?p.name:"")+'</h2>'
      + '<div class="feld"><label for="boGrund">Wofür</label>'
        + '<input type="text" id="boGrund" placeholder="z. B. Auto waschen geholfen"></div>'
      + '<div class="feld"><label for="boPunkte">Punkte</label>'
        + '<input type="text" id="boPunkte" inputmode="numeric" value="5"></div>'
      + '<div class="blatt-fuss">'
        + '<button class="knopf haupt" id="boPlus">Gutschreiben</button>'
        + '<button class="knopf" id="boMinus">Abziehen</button>'
        + '<button class="knopf" id="boAbbrechen">Abbrechen</button>'
      + '</div>'
    );
    function fertig(vorzeichen){
      var wert = Math.abs(parseInt(b.querySelector("#boPunkte").value, 10) || 0);
      if(!wert) return;
      var grund = b.querySelector("#boGrund").value.trim() || (vorzeichen>0 ? "Extra-Punkte" : "Abzug");
      buchen(pid, datum, grund, vorzeichen*wert, vorzeichen>0 ? "bonus" : "abzug");
      blattSchliessen();
    }
    b.querySelector("#boPlus").addEventListener("click", function(){ fertig(1); });
    b.querySelector("#boMinus").addEventListener("click", function(){ fertig(-1); });
    b.querySelector("#boAbbrechen").addEventListener("click", blattSchliessen);
  }

  function aufgabenFormular(){
    var b = blattOeffnen(
      '<h2>Aufgaben &amp; Belohnungen</h2>'
      + '<div class="feld"><label>Aufgaben – wofür es Punkte gibt</label>'
        + '<div class="personen-tabelle" id="aTabelle"></div>'
        + '<button class="knopf" id="aNeu">+ Aufgabe</button></div>'
      + '<div class="feld" style="margin-top:20px"><label>Belohnungen – wofür Punkte ausgegeben werden</label>'
        + '<div class="personen-tabelle" id="rTabelle"></div>'
        + '<button class="knopf" id="rNeu">+ Belohnung</button></div>'
      + '<div class="blatt-fuss"><button class="knopf haupt" id="abFertig">Fertig</button></div>'
    );
    var kinder = punkteKinder();
    var aufgaben = state.aufgaben.map(function(a){
      return {id:a.id, titel:a.titel, punkte:a.punkte, personId:a.personId||""};
    });
    var belohnungen = state.belohnungen.map(function(r){
      return {id:r.id, titel:r.titel, kosten:r.kosten, personId:r.personId||""};
    });
    if(!aufgaben.length) aufgaben.push({id:null, titel:"", punkte:2, personId:""});
    if(!belohnungen.length) belohnungen.push({id:null, titel:"", kosten:50, personId:""});

    function wahl(gewaehlt){
      return '<option value="">alle</option>' + kinder.map(function(p){
        return '<option value="'+escape(p.id)+'"'+(p.id===gewaehlt?" selected":"")+'>'+escape(p.name)+'</option>';
      }).join("");
    }
    function zeichneListen(){
      b.querySelector("#aTabelle").innerHTML = aufgaben.map(function(a,i){
        return '<div class="preihe">'
          + '<input type="text" value="'+escape(a.titel)+'" data-liste="a" data-i="'+i+'" data-feld="titel" placeholder="z. B. Zimmer aufräumen" aria-label="Aufgabe">'
          + '<input type="text" class="schmal" inputmode="numeric" value="'+escape(a.punkte)+'" data-liste="a" data-i="'+i+'" data-feld="punkte" aria-label="Punkte">'
          + '<select data-liste="a" data-i="'+i+'" data-feld="personId" aria-label="für wen">'+wahl(a.personId)+'</select>'
          + '<button class="weg" data-weg="a" data-i="'+i+'" aria-label="Aufgabe entfernen">×</button></div>';
      }).join("");
      b.querySelector("#rTabelle").innerHTML = belohnungen.map(function(r,i){
        return '<div class="preihe">'
          + '<input type="text" value="'+escape(r.titel)+'" data-liste="r" data-i="'+i+'" data-feld="titel" placeholder="z. B. Kino" aria-label="Belohnung">'
          + '<input type="text" class="schmal" inputmode="numeric" value="'+escape(r.kosten)+'" data-liste="r" data-i="'+i+'" data-feld="kosten" aria-label="Kosten in Punkten">'
          + '<select data-liste="r" data-i="'+i+'" data-feld="personId" aria-label="für wen">'+wahl(r.personId)+'</select>'
          + '<button class="weg" data-weg="r" data-i="'+i+'" aria-label="Belohnung entfernen">×</button></div>';
      }).join("");
    }
    zeichneListen();

    function ziel(t){ return t.dataset.liste==="a" ? aufgaben : belohnungen; }
    b.addEventListener("input", function(ev){
      var t = ev.target; if(!t.dataset || !t.dataset.liste) return;
      ziel(t)[+t.dataset.i][t.dataset.feld] = t.value;
    });
    b.addEventListener("change", function(ev){
      var t = ev.target; if(!t.dataset || !t.dataset.liste || t.dataset.feld!=="personId") return;
      ziel(t)[+t.dataset.i].personId = t.value;
    });
    b.addEventListener("click", function(ev){
      var w = ev.target.closest("[data-weg]"); if(!w) return;
      (w.dataset.weg==="a" ? aufgaben : belohnungen).splice(+w.dataset.i, 1);
      zeichneListen();
    });
    b.querySelector("#aNeu").addEventListener("click", function(){
      aufgaben.push({id:null, titel:"", punkte:2, personId:""}); zeichneListen();
    });
    b.querySelector("#rNeu").addEventListener("click", function(){
      belohnungen.push({id:null, titel:"", kosten:50, personId:""}); zeichneListen();
    });

    b.querySelector("#abFertig").addEventListener("click", function(){
      var behaltenA = {}, behaltenR = {};
      var bisherA = state.aufgaben.slice(), bisherR = state.belohnungen.slice();
      aufgaben.forEach(function(a){
        var titel = (a.titel||"").trim(); if(!titel) return;
        var daten = {titel:titel, punkte: parseInt(a.punkte,10)||0, personId:a.personId||""};
        if(a.id){ behaltenA[a.id]=true; speichern("aufgaben", a.id, daten); }
        else anlegen("aufgaben", daten);
      });
      bisherA.forEach(function(a){ if(!behaltenA[a.id]) entfernen("aufgaben", a.id); });

      belohnungen.forEach(function(r){
        var titel = (r.titel||"").trim(); if(!titel) return;
        var daten = {titel:titel, kosten: parseInt(r.kosten,10)||0, personId:r.personId||""};
        if(r.id){ behaltenR[r.id]=true; speichern("belohnungen", r.id, daten); }
        else anlegen("belohnungen", daten);
      });
      bisherR.forEach(function(r){ if(!behaltenR[r.id]) entfernen("belohnungen", r.id); });
      blattSchliessen();
    });
  }

  // ---------- Erinnerungen ----------
  var gefeuert = {};
  try{ gefeuert = JSON.parse(localStorage.getItem("fp_erinnert") || "{}") || {}; }catch(_){ gefeuert = {}; }

  function merkeGefeuert(key){
    gefeuert[key] = 1;
    try{
      var heute = heuteIso(), sauber = {};
      Object.keys(gefeuert).forEach(function(k){ if(k.slice(0,10) >= heute) sauber[k] = 1; });
      gefeuert = sauber;
      localStorage.setItem("fp_erinnert", JSON.stringify(gefeuert));
    }catch(_){}
  }
  function zeitAmTag(iso, hhmm){
    var t = iso.split("-"), u = hhmm.split(":");
    return new Date(+t[0], +t[1]-1, +t[2], +u[0], +u[1], 0, 0);
  }
  function alarmZeigen(e, start){
    var p = person(e.personId);
    var text = (p ? p.name+": " : "") + e.titel + (e.ort ? " ("+e.ort+")" : "");
    var zeit = e.von;
    try{
      if(window.Notification && Notification.permission === "granted"){
        new Notification("Um "+zeit+": "+e.titel, { body: text, tag: "fp-"+e.id });
      }
    }catch(_){}
    var d = document.createElement("div");
    d.className = "alarm";
    d.innerHTML = '<span class="a-text"><span class="a-zeit">'+escape(zeit)+'</span> · '
      + '<span class="a-titel">'+escape(text)+'</span></span>'
      + '<button class="a-weg">OK</button>';
    d.querySelector(".a-weg").addEventListener("click", function(){ d.remove(); });
    el("alarmStapel").appendChild(d);
  }
  function pruefeErinnerungen(){
    var jetzt = new Date();
    var kandidaten = [];
    [0,1].forEach(function(versatz){
      var d = new Date(jetzt.getTime() + versatz*86400000);
      var iso = isoVon(d), tag = (d.getDay()+6)%7;
      state.wochenplan.forEach(function(e){
        if(e.tag===tag && e.erinnerungMin>0 && e.von) kandidaten.push({e:e, iso:iso});
      });
      state.termine.forEach(function(e){
        if(e.datum===iso && e.erinnerungMin>0 && e.von) kandidaten.push({e:e, iso:iso});
      });
    });
    kandidaten.forEach(function(k){
      var start = zeitAmTag(k.iso, k.e.von);
      var weck = new Date(start.getTime() - k.e.erinnerungMin*60000);
      var key = k.iso+"|"+k.e.id;
      if(gefeuert[key]) return;
      if(jetzt >= weck && jetzt < start){
        merkeGefeuert(key);
        alarmZeigen(k.e, start);
      }
    });
  }
  function erinnerungsKnopfPruefen(){
    var b = el("btnErinnerung");
    var moeglich = false;
    try{ moeglich = !!window.Notification && Notification.permission !== "granted"; }catch(_){}
    b.hidden = !moeglich;
    try{ if(window.Notification && Notification.permission === "denied") b.hidden = true; }catch(_){}
  }
  el("btnErinnerung").addEventListener("click", function(){
    try{
      Notification.requestPermission().then(function(){ erinnerungsKnopfPruefen(); });
    }catch(_){ erinnerungsKnopfPruefen(); }
  });
  erinnerungsKnopfPruefen();
  setInterval(pruefeErinnerungen, 30000);
  setTimeout(pruefeErinnerungen, 2500);

  // ---------- Bedienung ----------
  document.querySelectorAll(".tab").forEach(function(t){
    t.addEventListener("click", function(){ state.tab = t.dataset.tab; zeichne(); });
  });
  el("btnNeu").addEventListener("click", function(){ eintragFormular(null, null); });
  el("btnPersonen").addEventListener("click", personenFormular);
  el("btnDrucken").addEventListener("click", function(){
    if(state.tab!=="woche"){ state.tab="woche"; zeichne(); }
    setTimeout(function(){ window.print(); }, 60);
  });
  el("inhalt").addEventListener("click", function(ev){
    var datum = state.punkteDatum || heuteIso();

    var a = ev.target.closest(".aufgabe");
    if(a){
      var aufgabe = null;
      state.aufgaben.forEach(function(x){ if(x.id===a.dataset.aid) aufgabe = x; });
      if(aufgabe) aufgabeUmschalten(a.dataset.pid, datum, aufgabe);
      return;
    }
    var w = ev.target.closest(".b-weg");
    if(w){ buchungLoeschen(w.dataset.pid, w.dataset.bdatum, w.dataset.bid); return; }
    var ein = ev.target.closest("[data-einloesen]");
    if(ein){ einloesenFormular(ein.dataset.einloesen, datum); return; }
    var bo = ev.target.closest("[data-bonus]");
    if(bo){ bonusFormular(bo.dataset.bonus, datum); return; }

    var e = ev.target.closest(".eintrag, .block, .gt-block"); if(!e) return;
    eintragFormular(e.dataset.art, e.dataset.id);
  });
  el("personenLeiste").addEventListener("click", function(ev){
    var c = ev.target.closest("[data-pid]"); if(!c) return;
    state.filter = state.filter===c.dataset.pid ? null : c.dataset.pid;
    zeichne();
  });

  zeichne();

  // ---------- Familien-Code ----------
  var CODE_SCHLUESSEL = "fp_familiencode";
  var verbunden = false;

  function codeSaeubern(c){ return String(c||"").trim().replace(/[^A-Za-z0-9_.~:@+-]/g, ""); }
  function codeLesen(){ try{ return localStorage.getItem(CODE_SCHLUESSEL) || ""; }catch(_){ return ""; } }
  function codeSchreiben(c){ try{ localStorage.setItem(CODE_SCHLUESSEL, c); }catch(_){} }
  function codeLoeschen(){
    verbunden = false;
    try{ localStorage.removeItem(CODE_SCHLUESSEL); }catch(_){}
  }
  function torZeigen(fehlerText){
    var f = el("torFehler");
    if(fehlerText){ f.hidden = false; f.textContent = fehlerText; } else { f.hidden = true; }
    el("torCode").value = "";
    el("tor").hidden = false;
    setTimeout(function(){ try{ el("torCode").focus(); }catch(_){} }, 60);
  }
  el("torOk").addEventListener("click", function(){
    var c = codeSaeubern(el("torCode").value);
    if(!c) return;
    codeSchreiben(c);
    el("tor").hidden = true;
    verbinden_mit(c);
  });
  el("torCode").addEventListener("keydown", function(ev){
    if(ev.key==="Enter"){ ev.preventDefault(); el("torOk").click(); }
  });

  // ---------- Gemeinsamen Speicher verbinden ----------
  function verbinden_mit(code){
    if(verbunden) return;
    var wurzel = firebase.firestore().collection("raeume").doc(code);
    db = { collection: function(name){ return wurzel.collection(name); } };
    verbunden = true;
    speicherBereit = true;
    if(hinweisArt==="fehler"){ el("hinweis").hidden = true; hinweisArt = null; }
    ["personen","wochenplan","termine","aufgaben","belohnungen","punkte"].forEach(abonnieren);
    erstbefuellung();
  }

  // Beim allerersten Start ein paar Aufgaben und Belohnungen als Vorlage anlegen.
  function erstbefuellung(){
    db.collection("aufgaben").get().then(function(snap){
      if(!snap.empty) return;
      var aufgaben = [
        ["a-hausuebung", "Hausübung ohne Erinnern gemacht", 3],
        ["a-zimmer",     "Zimmer aufgeräumt",               2],
        ["a-tisch",      "Tisch abgeräumt",                 1],
        ["a-muell",      "Müll rausgebracht",               2],
        ["a-ueben",      "Geübt (Musik)",                   3]
      ];
      aufgaben.forEach(function(a){
        db.collection("aufgaben").doc(a[0]).set({titel:a[1], punkte:a[2], personId:""}).catch(function(){});
      });
      var belohnungen = [
        ["b-bildschirm", "30 Minuten extra Bildschirmzeit", 15],
        ["b-eis",        "Eis essen gehen",                 25],
        ["b-schwimmbad", "Schwimmbad",                      40],
        ["b-kino",       "Kino",                            60]
      ];
      belohnungen.forEach(function(b){
        db.collection("belohnungen").doc(b[0]).set({titel:b[1], kosten:b[2], personId:""}).catch(function(){});
      });
    }).catch(function(){});
  }

  function start(){
    if(!window.firebase || !window.FIREBASE_KONFIG || !FIREBASE_KONFIG.apiKey){
      meldung("In der Datei fehlen noch die Zugangsdaten aus Firebase. Solange bleiben Änderungen nur in diesem Fenster.", null, null, "fehler");
      return;
    }
    try{
      firebase.initializeApp(FIREBASE_KONFIG);
    }catch(e){
      meldung("Die Zugangsdaten in der Datei stimmen nicht. Bitte nochmal aus Firebase kopieren.", null, null, "fehler");
      return;
    }
    firebase.auth().onAuthStateChanged(function(nutzer){
      if(!nutzer) return;
      var c = codeLesen();
      if(c) verbinden_mit(c); else torZeigen(null);
    });
    firebase.auth().signInAnonymously().catch(function(){
      meldung("Anmeldung nicht möglich. In Firebase muss die anonyme Anmeldung eingeschaltet sein.", null, null, "fehler");
    });
  }
  start();
})();
</script>
