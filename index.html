<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F5D4C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Familienplaner">
<title>Familienplaner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap">
<style>
  html{color-scheme:light dark;-webkit-text-size-adjust:100%}
  :root{
    padding-top:env(safe-area-inset-top, 0px);
    padding-bottom:env(safe-area-inset-bottom, 0px);
  }
  body{margin:0}
  img{max-width:100%}
  [hidden]{display:none !important}

  :root{
    --bg:#F4F5F2;
    --surface:#FFFFFF;
    --surface-2:#EAEDE8;
    --ink:#1A211E;
    --muted:#66716B;
    --line:#D6DDD6;
    --accent:#1F5D4C;
    --accent-ink:#FFFFFF;
    --accent-soft:#DDEAE3;
    --danger:#9E3B30;
    --shadow:0 1px 2px rgba(26,33,30,.07), 0 6px 18px rgba(26,33,30,.06);

    --p-pine:#2F6F5C;
    --p-plum:#7B3F6B;
    --p-ocker:#A8720E;
    --p-stahl:#2D5C86;
    --p-ziegel:#A34237;
    --p-schiefer:#4A5560;

    --p-pine-weich:#E4F0EB;
    --p-plum-weich:#F2E6EF;
    --p-ocker-weich:#F7EDDA;
    --p-stahl-weich:#E2ECF6;
    --p-ziegel-weich:#F8E6E3;
    --p-schiefer-weich:#E9ECEA;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#141813;
      --surface:#1E241F;
      --surface-2:#27302A;
      --ink:#E9EEE8;
      --muted:#9AA69D;
      --line:#333D36;
      --accent:#6FC0A5;
      --accent-ink:#10231C;
      --accent-soft:#243A31;
      --danger:#E08A7E;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);

      --p-pine:#6FC0A5;
      --p-plum:#C48FB6;
      --p-ocker:#E0A94A;
      --p-stahl:#7FB0DE;
      --p-ziegel:#E08A7E;
      --p-schiefer:#A8B4AB;

      --p-pine-weich:#1E3A31;
      --p-plum-weich:#35263180;
      --p-ocker-weich:#3A3120;
      --p-stahl-weich:#22303D;
      --p-ziegel-weich:#3A2926;
      --p-schiefer-weich:#2A312C;
    }
  }
  :root[data-theme="dark"]{
    --bg:#141813;
    --surface:#1E241F;
    --surface-2:#27302A;
    --ink:#E9EEE8;
    --muted:#9AA69D;
    --line:#333D36;
    --accent:#6FC0A5;
    --accent-ink:#10231C;
    --accent-soft:#243A31;
    --danger:#E08A7E;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);

    --p-pine:#6FC0A5;
    --p-plum:#C48FB6;
    --p-ocker:#E0A94A;
    --p-stahl:#7FB0DE;
    --p-ziegel:#E08A7E;
    --p-schiefer:#A8B4AB;

    --p-pine-weich:#1E3A31;
    --p-plum-weich:#352631;
    --p-ocker-weich:#3A3120;
    --p-stahl-weich:#22303D;
    --p-ziegel-weich:#3A2926;
    --p-schiefer-weich:#2A312C;
  }

  *{box-sizing:border-box}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Source Sans 3", system-ui, -apple-system, Segoe UI, sans-serif;
    font-size:16px;
    line-height:1.45;
    -webkit-text-size-adjust:100%;
  }
  h1,h2,h3,.ui{font-family:"Archivo", system-ui, sans-serif}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer}

  /* ---------- Kopfleiste ---------- */
  header{
    position:sticky;
    top:env(safe-area-inset-top, 0px);
    z-index:20;
    background:var(--bg);
    border-bottom:1px solid var(--line);
  }
  .kopf{
    max-width:1280px;margin:0 auto;
    padding:10px 16px 0;
    display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
  }
  .kopf h1{
    font-size:19px;letter-spacing:-.01em;margin:0;font-weight:700;
  }
  .kopf .heute-datum{
    color:var(--muted);font-size:14px;margin-left:auto;
    font-variant-numeric:tabular-nums;
  }
  nav{
    max-width:1280px;margin:0 auto;
    padding:8px 16px 10px;
    display:flex;gap:6px;align-items:center;flex-wrap:wrap;
  }
  .tab{
    border:1px solid transparent;background:transparent;color:var(--muted);
    padding:8px 14px;border-radius:999px;font-family:"Archivo",sans-serif;
    font-weight:600;font-size:15px;min-height:40px;
  }
  .tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
  .tab:not([aria-selected="true"]):hover{background:var(--surface-2);color:var(--ink)}
  .kopf-werkzeug{margin-left:auto;display:flex;gap:6px;align-self:center}

  /* ---------- Am Handy: größere Flächen, weniger Gedränge ---------- */
  @media (max-width:680px){
    body{font-size:16.5px}
    .kopf{padding:8px 14px 0;gap:8px}
    .kopf h1{font-size:18px}
    .heute-datum{display:none}
    nav{padding:8px 14px 10px;gap:5px}
    .tab{flex:1 1 0;min-width:0;padding:11px 4px;font-size:15px;min-height:48px;text-align:center}
    #btnDrucken{display:none}
    .icon-btn{min-height:44px;padding:0 14px;font-size:14.5px}
    main{padding-left:14px;padding-right:14px;padding-block:16px 130px}

    .pchip{min-height:44px;font-size:15px;padding:8px 14px}
    .eintrag{grid-template-columns:5px 66px 1fr}
    .eintrag .zeit{padding:15px 0 15px 12px;font-size:16px}
    .eintrag .text{padding:15px 14px 15px 0}
    .eintrag .titel{font-size:16.5px}
    .eintrag .meta{font-size:14.5px}

    .aufgabe{min-height:56px;font-size:16px;padding:12px 14px}
    .aufgabe .haken{width:26px;height:26px}
    .pk-fuss .knopf{min-height:52px}
    .buchung{font-size:15px}
    .buchung .b-weg{font-size:22px;padding:6px 10px}

    .kal-tag{min-height:44px;font-size:16px}
    .kal-leer{min-height:44px}
    .kal-marke{min-height:38px;font-size:13.5px}
    .kal-pfeil{min-width:44px;min-height:44px}
    .knopf{min-height:52px;font-size:16px}
    input[type=text],input[type=time],input[type=date],select,textarea{min-height:50px;font-size:16.5px}
    .chip{min-height:48px;font-size:15.5px;padding:10px 14px}
    .blatt{padding:16px 14px calc(16px + env(safe-area-inset-bottom, 0px))}
    .neu{padding:15px 24px;font-size:17px;min-height:56px}
    .nur-gross{display:none}
    .wochen-kopf{flex-wrap:nowrap}
    .wk-text{flex:1;text-align:center;font-size:15px}
  }
  .icon-btn{
    background:var(--surface);border:1px solid var(--line);border-radius:10px;
    min-height:40px;min-width:40px;padding:0 12px;color:var(--muted);
    font-family:"Archivo",sans-serif;font-weight:600;font-size:14px;
  }
  .icon-btn:hover{color:var(--ink);border-color:var(--muted)}

  main{max-width:1280px;margin:0 auto;padding-block:18px 120px;padding-left:16px;padding-right:16px}

  .hinweis{
    display:flex;gap:10px;align-items:center;flex-wrap:wrap;
    background:var(--accent-soft);border:1px solid var(--line);
    border-radius:12px;padding:10px 14px;margin-bottom:16px;
    font-size:14px;color:var(--ink);
  }
  .hinweis button{
    background:transparent;border:1px solid var(--muted);border-radius:8px;
    padding:5px 10px;font-size:13px;font-weight:600;font-family:"Archivo",sans-serif;
  }

  /* ---------- Abschnitte ---------- */
  .abschnitt{margin-bottom:26px}
  .abschnitt-kopf{
    display:flex;align-items:baseline;gap:10px;margin-bottom:10px;
  }
  .abschnitt-kopf h2{
    font-size:13px;text-transform:uppercase;letter-spacing:.09em;
    color:var(--muted);margin:0;font-weight:600;
  }
  .abschnitt-kopf .zaehler{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}

  .liste{display:flex;flex-direction:column;gap:8px}

  /* ---------- Eintrag ---------- */
  .eintrag{
    display:grid;grid-template-columns:4px 62px 1fr;gap:0 12px;
    align-items:start;
    background:var(--surface);border:1px solid var(--line);border-radius:12px;
    padding:0;overflow:hidden;text-align:left;width:100%;
    box-shadow:var(--shadow);
  }
  .eintrag:hover{border-color:var(--muted)}
  .eintrag .streifen{background:var(--pf, var(--muted));align-self:stretch}
  .eintrag .zeit{
    padding:12px 0 12px 10px;font-variant-numeric:tabular-nums;
    font-family:"Archivo",sans-serif;font-weight:600;font-size:15px;line-height:1.25;
  }
  .eintrag .zeit .bis{display:block;color:var(--muted);font-weight:500;font-size:13px}
  .eintrag .text{padding:12px 12px 12px 0;min-width:0}
  .eintrag .titel{font-weight:600;line-height:1.25;overflow-wrap:anywhere}
  .eintrag .meta{color:var(--muted);font-size:13.5px;overflow-wrap:anywhere}
  .eintrag .wer{color:var(--pf, var(--muted));font-weight:600}
  .eintrag .wer.fuer-alle{color:var(--muted)}
  .kal-anzahl.fehlt{color:var(--danger)}
  .eintrag.erledigt{opacity:.5}

  .daheim{
    display:inline-block;margin-top:3px;font-size:13px;color:var(--muted);
    font-variant-numeric:tabular-nums;
  }
  .daheim b{color:var(--ink);font-weight:600}

  /* ---------- Wochenraster ---------- */
  .wochenraster{display:grid;gap:10px;grid-template-columns:1fr}
  @media (min-width:560px){.wochenraster{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media (min-width:900px){.wochenraster{grid-template-columns:repeat(4,minmax(0,1fr))}}
  @media (min-width:1220px){.wochenraster{grid-template-columns:repeat(7,minmax(0,1fr))}}
  .tag{
    background:var(--surface-2);border:1px solid var(--line);border-radius:14px;
    padding:12px;display:flex;flex-direction:column;gap:8px;
  }
  .tag.ist-heute{border-color:var(--accent);background:var(--accent-soft)}
  .tag h3{
    margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.04em;
    color:var(--muted);font-weight:600;display:flex;justify-content:space-between;
    gap:8px;white-space:nowrap;
  }
  .tag.ist-heute h3{color:var(--accent)}
  /* In den schmalen Tagesspalten steht die Uhrzeit ueber dem Eintrag, nicht daneben. */
  .tag .eintrag{box-shadow:none;grid-template-columns:4px 1fr;gap:0}
  .tag .eintrag .streifen{grid-column:1;grid-row:1 / span 2}
  .tag .eintrag .zeit{grid-column:2;grid-row:1;padding:10px 10px 0;font-size:14px}
  .tag .eintrag .text{grid-column:2;grid-row:2}
  .tag .eintrag .zeit .bis{display:inline;margin-left:6px;font-size:13px}
  .tag .eintrag .text{padding:2px 10px 10px}

  .leer{color:var(--muted);font-size:14px;font-style:italic;padding:2px 0}
  /* ---------- Feiertage und schulfreie Tage ---------- */
  .ft{
    font-family:"Archivo",sans-serif;font-size:11.5px;font-weight:700;
    letter-spacing:.03em;text-transform:none;white-space:nowrap;
    border-radius:5px;padding:1px 6px;
  }
  .ft.gesetzlich{background:var(--accent);color:var(--accent-ink)}
  .ft.schulfrei{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
  .rk-tag .ft{display:block;margin-top:2px;width:fit-content;max-width:100%;overflow:hidden;text-overflow:ellipsis}
  .rk-tag.ist-feiertag{background:var(--surface)}
  .tag.ist-feiertag{border-color:var(--accent)}
  .abschnitt-kopf .ft{align-self:center}
  .kal-tag.ist-feiertag.gesetzlich{color:var(--accent);font-weight:700}
  .kal-tag.ist-feiertag.gesetzlich::after{
    content:"";display:block;width:4px;height:4px;border-radius:50%;
    background:var(--accent);margin:1px auto 0;
  }
  .kal-tag.ist-feiertag.schulfrei::after{
    content:"";display:block;width:4px;height:4px;border-radius:50%;
    background:var(--muted);margin:1px auto 0;
  }
  .kal-tag.an.ist-feiertag,.kal-tag.an.ist-feiertag.gesetzlich{color:var(--accent-ink)}
  .kal-tag.an.ist-feiertag::after{background:var(--accent-ink)}

  .tag.frei-tag{padding:9px 12px;background:transparent;border-style:dashed}
  .tag.frei-tag h3 i{font-style:italic;font-weight:400;text-transform:none;letter-spacing:0}

  /* ---------- Wochenansicht: Stundenraster ---------- */
  .wochen-kopf{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .wk-text{font-weight:600;font-variant-numeric:tabular-nums;font-size:15.5px}

  .nur-breit{display:none}
  @media (min-width:900px){
    .nur-breit{display:block}
    .nur-schmal{display:none}
  }

  .raster{
    background:var(--surface);border:1px solid var(--line);border-radius:14px;
    overflow:hidden;box-shadow:var(--shadow);
  }
  .raster-kopf,.raster-ganztags{
    display:grid;grid-template-columns:56px repeat(7,minmax(0,1fr));
    border-bottom:1px solid var(--line);
  }
  .raster-kopf{background:var(--surface-2)}
  .rk-ecke{
    padding:8px 6px;font-size:11px;color:var(--muted);text-align:right;
    font-family:"Archivo",sans-serif;font-weight:600;
  }
  .rk-tag{
    padding:9px 8px;font-family:"Archivo",sans-serif;font-size:13px;color:var(--muted);
    border-left:1px solid var(--line);font-variant-numeric:tabular-nums;
  }
  .rk-tag b{color:var(--ink);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
  .rk-tag.ist-heute{background:var(--accent-soft)}
  .rk-tag.ist-heute b{color:var(--accent)}
  .gt-zelle{
    border-left:1px solid var(--line);padding:5px;display:flex;flex-direction:column;gap:4px;
    min-height:34px;
  }
  .gt-zelle.ist-heute{background:var(--accent-soft)}
  .gt-block{
    background:var(--pw);border:1px solid transparent;border-left:3px solid var(--pf);
    border-radius:6px;padding:4px 7px;text-align:left;color:var(--ink);
    display:flex;flex-direction:column;gap:1px;overflow:hidden;min-width:0;
  }
  .gt-block:hover{border-color:var(--pf)}
  .gt-block b{
    font-size:12.5px;font-weight:700;line-height:1.2;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .gt-block span{
    font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .gt-block i{font-style:normal;color:var(--pf);font-weight:700}

  .raster-koerper{
    position:relative;
    display:grid;grid-template-columns:56px repeat(7,minmax(0,1fr));
  }
  .raster-stunden{position:relative}
  .rs-stunde{
    position:absolute;right:6px;transform:translateY(-50%);
    font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;
    font-family:"Archivo",sans-serif;font-weight:600;
  }
  .raster-spalte{
    position:relative;border-left:1px solid var(--line);
    background:repeating-linear-gradient(
      to bottom,
      var(--line) 0px, var(--line) 1px,
      transparent 1px, transparent var(--stunde, 51px)
    );
  }
  .raster-spalte.ist-heute{
    background:
      repeating-linear-gradient(to bottom, var(--line) 0px, var(--line) 1px, transparent 1px, transparent var(--stunde, 51px)),
      var(--accent-soft);
  }
  .block{
    position:absolute;overflow:hidden;text-align:left;min-width:0;
    background:var(--pw);border:1px solid transparent;border-left:3px solid var(--pf);
    border-radius:7px;padding:4px 6px;display:flex;flex-direction:column;gap:1px;
  }
  .block:hover{border-color:var(--pf);z-index:3}
  .bl-titel{
    font-weight:700;font-size:12.5px;line-height:1.2;color:var(--ink);
    overflow:hidden;text-overflow:ellipsis;
  }
  .bl-neben{
    font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .block.kurz{flex-direction:row;align-items:baseline;gap:5px;padding:2px 6px}
  .block.kurz .bl-titel{font-size:12px;white-space:nowrap}
  .block.kurz .bl-neben{font-size:11px}
  /* Bei drei oder mehr Terminen nebeneinander bleibt nur der Name */
  .block.schmal{padding:3px 4px;border-left-width:4px}
  .block.schmal .bl-titel{font-size:11.5px;white-space:nowrap}
  .block.schmal .bl-neben{display:none}
  .jetzt-linie{
    position:absolute;left:56px;right:0;height:2px;background:var(--danger);
    z-index:4;pointer-events:none;
  }
  .jetzt-linie::before{
    content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;
    border-radius:50%;background:var(--danger);
  }

  /* ---------- Personen-Chips ---------- */
  .personen-leiste{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .pchip{
    display:inline-flex;align-items:center;gap:7px;
    background:var(--surface);border:1px solid var(--line);border-radius:999px;
    padding:6px 12px;font-size:14px;font-weight:600;min-height:36px;
  }
  .pchip[aria-pressed="false"]{opacity:.45}
  .pchip .punkt{width:10px;height:10px;border-radius:50%;background:var(--pf);flex:none}

  /* ---------- Knopf unten ---------- */
  .neu{
    position:fixed;right:16px;
    bottom:calc(16px + env(safe-area-inset-bottom, 0px));
    z-index:30;
    background:var(--accent);color:var(--accent-ink);border:none;
    border-radius:999px;padding:14px 22px;font-family:"Archivo",sans-serif;
    font-weight:700;font-size:16px;box-shadow:0 8px 24px rgba(0,0,0,.22);
    min-height:52px;
  }

  /* ---------- Formular-Fenster ---------- */
  .schleier{
    position:fixed;inset:0;z-index:40;background:rgba(10,14,12,.5);
    display:flex;align-items:flex-end;justify-content:center;
  }
  @media (min-width:640px){.schleier{align-items:center}}
  .blatt{
    background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;
    border-radius:18px 18px 0 0;border:1px solid var(--line);
    padding:18px 18px calc(18px + env(safe-area-inset-bottom, 0px));
  }
  @media (min-width:640px){.blatt{border-radius:18px}}
  .blatt h2{margin:0 0 14px;font-size:19px}
  .feld{margin-bottom:14px}
  .feld > label{
    display:block;font-size:13px;text-transform:uppercase;letter-spacing:.07em;
    color:var(--muted);font-weight:600;margin-bottom:5px;font-family:"Archivo",sans-serif;
  }
  input[type=text],input[type=time],input[type=date],select,textarea{
    width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;
    padding:11px 12px;min-height:46px;
  }
  textarea{min-height:70px;resize:vertical}
  .zeile{display:flex;gap:10px}
  .zeile > *{flex:1;min-width:0}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{
    border:1px solid var(--line);background:var(--bg);border-radius:10px;
    padding:9px 12px;font-weight:600;font-size:14px;min-height:44px;min-width:48px;
    font-family:"Archivo",sans-serif;
  }
  .chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .blatt-fuss{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
  .knopf{
    border-radius:10px;padding:12px 18px;font-family:"Archivo",sans-serif;
    font-weight:700;font-size:15px;min-height:48px;border:1px solid var(--line);
    background:var(--bg);
  }
  .knopf.haupt{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);flex:1}
  .knopf.breit{flex:1;border-color:var(--accent);color:var(--accent)}
  .knopf.breit:hover{background:var(--accent-soft)}
  .knopf.loeschen{color:var(--danger);border-color:var(--danger);margin-left:auto;background:transparent}

  .personen-tabelle{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
  /* Die Zeile bricht um, sobald für den Namen weniger als 190px bleiben –
     dann steht das Textfeld ganz oben über die volle Breite. */
  .preihe{
